<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, shrink-to-fit=no, viewport-fit=cover" />
    <title>Tenis-Lab</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tenis-Lab" />
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-icon-192.png" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #111827;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Pre-loader / Splash Lite */
      #preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        width: 100%;
        background-color: #111827;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      .loader-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 24px;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
        100% { opacity: 0.6; transform: scale(0.98); }
      }
      /* Esconder el splash screen nativo de Expo */
      #expo-splash-screen {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    
    <!-- Lite Splash Screen / Pre-loader -->
    <div id="preloader">
      <img src="/pwa-icon-192.png" alt="Tenis-Lab" class="loader-logo" />
    </div>

    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) { console.log('[PWA] Service Worker registered:', reg.scope); })
            .catch(function(err) { console.warn('[PWA] Service Worker registration failed:', err); });
        });
      }
      
      // Remove preloader once app is ready
      window.addEventListener('load', function() {
        const preloader = document.getElementById('preloader');
        if (preloader) {
          setTimeout(() => {
            preloader.style.opacity = '0';
            setTimeout(() => preloader.remove(), 300);
          }, 100);
        }
      });
    </script>
  </body>
</html>
